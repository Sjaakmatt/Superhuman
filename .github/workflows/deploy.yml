name: Deploy Ultra100 (Cloudflare)

# Auto-deploy naar Cloudflare Workers bij een merge naar main — gespiegeld op
# pavo-leadscanner/.github/workflows/deploy.yml.
#
# Vereist repo-secrets:
#   CLOUDFLARE_API_TOKEN    scope: Workers Scripts Edit
#   CLOUDFLARE_ACCOUNT_ID
#
# En repo-Variables (Settings → Secrets and variables → Actions → Variables):
#   NEXT_PUBLIC_SUPABASE_URL       vereist
#   NEXT_PUBLIC_SUPABASE_ANON_KEY  vereist
#   NEXT_PUBLIC_SITE_URL           optioneel — de Strava-callback valt terug op
#                                  de URL van het verzoek. Zet hem zodra je weet
#                                  waar de app draait; dan is de callback stabiel.
#   NEXT_PUBLIC_VAPID_PUBLIC_KEY   optioneel — leeg = geen ochtendmelding
#
# Waarom die vier als Variable en niet als Worker-secret: Next bakt NEXT_PUBLIC_*
# bij de build in de client-bundel. Ze zijn publiek by design — de anon key komt
# sowieso in de browser en RLS beschermt de data. Op de Worker-runtime zetten
# werkt dus níét; ze moeten hier staan.
#
# De guard hieronder is er met reden: in pavo-leadscanner stond ooit de
# placeholder `<anon>` in een Variable, die Next letterlijk in de bundel bakte,
# waarna Supabase "Invalid API key" gaf bij het inloggen. Beter luid falen dan
# een kapotte bundel uitrollen.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ultra100
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22' # wrangler 4 vereist Node >= 22
          cache: 'npm'

      - run: npm ci

      # Dezelfde controles als CI. Een rode test hoort niet live te komen,
      # ook niet als iemand rechtstreeks naar main duwt.
      - name: Typecheck, lint en tests
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Controleer de configuratie
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          fout=0

          # Zonder deze twee bakt Next een onbruikbare client-bundel.
          vereist() {
            naam="$1"; waarde="$2"
            if [ -z "$waarde" ]; then
              echo "::error::$naam ontbreekt."
              fout=1
            elif printf '%s' "$waarde" | grep -qE '^<|REPLACE_ME|voorbeeld|changeme'; then
              echo "::error::$naam bevat een placeholder."
              fout=1
            fi
          }
          # Deze kan de app missen; hij zegt het alleen even.
          optioneel() {
            [ -n "$2" ] || echo "::warning::$1 is niet gezet — $3"
          }

          vereist "repo-Variable NEXT_PUBLIC_SUPABASE_URL" "$SUPABASE_URL"
          vereist "repo-Variable NEXT_PUBLIC_SUPABASE_ANON_KEY" "$SUPABASE_ANON_KEY"
          vereist "repo-secret CLOUDFLARE_API_TOKEN" "$CF_TOKEN"
          vereist "repo-secret CLOUDFLARE_ACCOUNT_ID" "$CF_ACCOUNT"

          optioneel "NEXT_PUBLIC_SITE_URL" "$SITE_URL" \
            "de Strava-callback valt terug op de URL van het verzoek. Zet hem zodra je weet waar de app draait."
          optioneel "NEXT_PUBLIC_VAPID_PUBLIC_KEY" "$VAPID_PUBLIC_KEY" \
            "de ochtendmelding blijft uit."

          if [ "$fout" = 1 ]; then
            echo "Zet ze onder Settings → Secrets and variables → Actions."
            exit 1
          fi

          # Een afsluitende slash in de project-URL levert //rest/v1/... op.
          schoon="${SUPABASE_URL%/}"
          [ "$schoon" = "$SUPABASE_URL" ] || echo "::warning::Afsluitende slash uit NEXT_PUBLIC_SUPABASE_URL gehaald."
          echo "NEXT_PUBLIC_SUPABASE_URL=$schoon" >> "$GITHUB_ENV"

          echo "Configuratie in orde."

      # Draait `opennextjs-cloudflare build && opennextjs-cloudflare deploy`.
      # Runtime-secrets (SUPABASE_SERVICE_ROLE_KEY, STRAVA_*, ANTHROPIC_API_KEY,
      # CRON_SECRET, VAPID_PRIVATE_KEY) staan los op de Worker, gezet met
      # `npx wrangler secret put <NAAM>`. Die horen hier niet.
      - name: Build en deploy naar Cloudflare
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # NEXT_PUBLIC_SUPABASE_URL komt uit de controlestap hierboven, zonder
          # afsluitende slash — anders wordt het //rest/v1/... in elk verzoek.
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
